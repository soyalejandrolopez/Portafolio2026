<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acceso Denegado | Portfolio de Servicios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7c2d12 0%, #dc2626 50%, #ef4444 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background */
        .bg-circles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite;
        }

        .circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 10%;
            animation-delay: 3s;
        }

        .circle:nth-child(3) {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: 30%;
            animation-delay: 1.5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) translateX(0);
            }

            25% {
                transform: translateY(-30px) translateX(30px);
            }

            50% {
                transform: translateY(-60px) translateX(-30px);
            }

            75% {
                transform: translateY(-30px) translateX(-60px);
            }
        }

        /* Error container */
        .error-container {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            max-width: 600px;
            padding: 3rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: shake 3s ease-in-out infinite;
        }

        @keyframes shake {

            0%,
            100% {
                transform: rotate(0deg);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: rotate(-2deg);
            }

            20%,
            40%,
            60%,
            80% {
                transform: rotate(2deg);
            }
        }

        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .error-description {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }

        .emoji {
            font-size: 80px;
            margin-bottom: 1rem;
            display: block;
            animation: swing 2s ease-in-out infinite;
        }

        @keyframes swing {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(10deg);
            }

            75% {
                transform: rotate(-10deg);
            }
        }

        .btn-home {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #7c2d12;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin: 0.5rem;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            background: #fef2f2;
        }

        .btn-home:active {
            transform: translateY(-1px);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .error-code {
                font-size: 80px;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-description {
                font-size: 1rem;
            }

            .emoji {
                font-size: 60px;
            }

            .error-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .circle:nth-child(1) {
                width: 200px;
                height: 200px;
            }

            .circle:nth-child(2) {
                width: 150px;
                height: 150px;
            }

            .circle:nth-child(3) {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="error-container">
        <span class="emoji">🚫</span>
        <div class="error-code">403</div>
        <h1 class="error-title">Acceso Denegado</h1>
        <p class="error-description">
            No tienes permiso para acceder a este recurso.
            <br>
            Si crees que esto es un error, contacta al administrador del sitio.
        </p>
        <a href="/" class="btn-home">🏠 Volver al Inicio</a>
    </div>
</body>

</html>
